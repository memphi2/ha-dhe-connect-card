version: 2
# Routine dependency refreshes are reviewed maintenance. Security updates remain
# enabled separately in repository settings and use their own PR limit.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
