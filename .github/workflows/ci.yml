name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/npm_ci_with_deprecation_guard.mjs

      - name: Check for deprecated package metadata
        run: npm run deprecation-check

      - name: Validate structured translations
        run: npm run i18n:check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/npm_ci_with_deprecation_guard.mjs

      - name: Check for deprecated package metadata
        run: npm run deprecation-check

      - name: Run checks
        env:
          LEGAL_BLOCKLIST_TERMS: ${{ secrets.LEGAL_BLOCKLIST_TERMS }}
          LEGAL_BLOCKLIST_REGEX: ${{ secrets.LEGAL_BLOCKLIST_REGEX }}
        run: npm run check

      - name: Check GitHub metadata anonymization and legal hygiene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGAL_BLOCKLIST_TERMS: ${{ secrets.LEGAL_BLOCKLIST_TERMS }}
          LEGAL_BLOCKLIST_REGEX: ${{ secrets.LEGAL_BLOCKLIST_REGEX }}
        run: npm run github-metadata-check

  ha-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/npm_ci_with_deprecation_guard.mjs

      - name: Check for deprecated package metadata
        run: npm run deprecation-check

      - name: Build bundle
        run: npm run build

      - name: Check HACS and bundle compatibility
        run: npm run compat

      - name: Check HA storage fixture compatibility
        run: npm run ha:storage-smoke -- test/fixtures/ha-config

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/npm_ci_with_deprecation_guard.mjs

      - name: Check for deprecated package metadata
        run: npm run deprecation-check

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Run browser render smoke
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run render-smoke
