name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: node scripts/npm_ci_with_deprecation_guard.mjs

      - name: Check for deprecated package metadata
        run: npm run deprecation-check

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run full validation
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm run check
          npm run render-smoke
          npm run ha:storage-smoke -- test/fixtures/ha-config

      - name: Package HACS asset
        run: |
          mkdir -p release
          cp dist/ha-dhe-connect-card.js release/ha-dhe-connect-card.js
          cp dist/ha-dhe-connect-card.js.map release/ha-dhe-connect-card.js.map
          (cd release && zip -r ha-dhe-connect-card.zip ha-dhe-connect-card.js ha-dhe-connect-card.js.map)

      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: test -s "release-notes/${GITHUB_REF_NAME}.md"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ha-dhe-connect-card
          path: |
            release/ha-dhe-connect-card.js
            release/ha-dhe-connect-card.js.map
            release/ha-dhe-connect-card.zip

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: DHE Connect Card ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            release/ha-dhe-connect-card.js
            release/ha-dhe-connect-card.js.map
            release/ha-dhe-connect-card.zip
