name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node scripts/npm_ci_with_deprecation_guard.mjs

      - name: Check for deprecated package metadata
        run: npm run deprecation-check

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Run full validation
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          LEGAL_BLOCKLIST_TERMS: ${{ secrets.LEGAL_BLOCKLIST_TERMS }}
          LEGAL_BLOCKLIST_REGEX: ${{ secrets.LEGAL_BLOCKLIST_REGEX }}
        run: |
          npm run check
          npm run render-smoke
          npm run ha:storage-smoke -- test/fixtures/ha-config

      - name: Check GitHub metadata anonymization and legal hygiene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGAL_BLOCKLIST_TERMS: ${{ secrets.LEGAL_BLOCKLIST_TERMS }}
          LEGAL_BLOCKLIST_REGEX: ${{ secrets.LEGAL_BLOCKLIST_REGEX }}
        run: npm run github-metadata-check

      - name: Package HACS asset
        run: |
          mkdir -p release
          cp dist/ha-dhe-connect-card.js release/ha-dhe-connect-card.js
          cp dist/ha-dhe-connect-card.js.map release/ha-dhe-connect-card.js.map
          (cd release && zip -r ha-dhe-connect-card.zip ha-dhe-connect-card.js ha-dhe-connect-card.js.map)

      - name: Validate release archive
        run: npm run release-archive-check -- release/ha-dhe-connect-card.zip

      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: test -s "release-notes/${GITHUB_REF_NAME}.md"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ha-dhe-connect-card
          path: |
            release/ha-dhe-connect-card.js
            release/ha-dhe-connect-card.js.map
            release/ha-dhe-connect-card.zip

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: DHE Connect Card ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            release/ha-dhe-connect-card.js
            release/ha-dhe-connect-card.js.map
            release/ha-dhe-connect-card.zip
